[package]
name = "rusty_renju"
version = "1.0.0"
edition = "2024"

[features]
serde = ["dep:serde", "dep:serde_with", "dep:base64"]
typeshare = ["serde", "dep:typeshare"]
default = []

[lib]
name = "rusty_renju"
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
serde_with = { version = "3.21", optional = true }
typeshare = { version = "1.0", optional = true }

base64 = { version = "0.23.1", optional = true }

[dev-dependencies]
indoc = "2.0"
rand = "0.10"

services:
  mintaka-arena-worker:
    container_name: mintaka-arena-worker
    build:
      context: ..
      dockerfile: mintaka_arena/Dockerfile
    image: mintaka-arena-worker:latest
    network_mode: host
    environment:
      CARGO_INCREMENTAL: "1"
      AFFINITY_MATRIX: ${AFFINITY_MATRIX:-}
      PORTS: ${PORTS}
      ADDRESS: ${ADDRESS:-0.0.0.0}
    volumes:
      - ../compose-arena-data/artifacts:/app/mintaka/artifacts
      - ../compose-arena-data/target:/app/mintaka/target
      - ../compose-arena-data/cargo/registry:/usr/local/cargo/registry
